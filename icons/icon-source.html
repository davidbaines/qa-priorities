<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:wght@700&display=block" rel="stylesheet">
<style>
  /* Icon source for Priorities. Rendered at 512x512 with headless Chrome:
     icon-512.png    = ?plain     (stamp fills most of the tile)
     icon-maskable   = ?maskable  (stamp inside the 80% safe zone)
     Resized copies (192, 180, 32) are generated from icon-512.png. */
  html,body{margin:0;width:512px;height:512px;overflow:hidden}
  body{background:#F3F5F7;display:flex;align-items:center;justify-content:center}
  .stamp{
    width:400px;height:400px;border-radius:50%;background:#BE4229;
    display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);
  }
  body.maskable .stamp{width:320px;height:320px}
  .stamp span{
    font:700 260px/1 "Gentium Plus",Georgia,serif;color:#F3F5F7;
    transform:translateY(-14px);
  }
  body.maskable .stamp span{font-size:208px;transform:translateY(-11px)}
</style>
</head>
<body>
<div class="stamp"><span>P</span></div>
<script>
  if(location.search.indexOf("maskable") >= 0) document.body.classList.add("maskable");
</script>
</body>
</html>
