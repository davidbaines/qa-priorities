<!DOCTYPE html>
<html lang="en" class="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priorities</title>
<meta name="description" content="Rank anything by comparing two items at a time.">
<meta name="theme-color" content="#F3F5F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--VERSUS:DATA:BEGIN-->
<script type="application/json" id="versus-data">{"dataVersion":1,"standalone":false}</script>
<!--VERSUS:DATA:END-->

<script>
"use strict";
/* Registry + loader. Locales and styles are external, equal citizens: the shell
   contains no strings and no theme values. Data arrives either from the folders
   (via injected script tags, which work on file://) or, in a standalone export,
   from the JSON data block above. */
(function(){
  const V = window.VERSUS = {
    locales:{}, styles:{}, config:{}, failed:[],
    registerLocale:(id,def)=>{ V.locales[id]=def; },
    registerStyle:(id,def)=>{ V.styles[id]=def; }
  };
  let pending = 1, cb = null;              // the initial 1 is released by _load()
  const done = () => { if(--pending===0 && cb) cb(); };
  V.ready = fn => { cb = fn; if(pending===0) fn(); };
  V._load = function(){
    let data = {};
    try{ data = JSON.parse(document.getElementById("versus-data").textContent); }catch(e){}
    V.config = data;
    if(data.standalone){
      (data.locales||[]).forEach(l=>V.registerLocale(l.id,l));
      (data.styles||[]).forEach(s=>V.registerStyle(s.id,s));
      return done();
    }
    const inject = (names, dir) => (names||[]).forEach(n=>{
      pending++;
      const s = document.createElement("script");
      s.src = dir + "/" + n + ".js";
      s.setAttribute("data-versus-injected", "");   // stripped from exports
      s.onload = done;
      s.onerror = () => { V.failed.push(s.src); done(); };
      document.head.appendChild(s);
    });
    inject(V.localeList, "locales");
    inject(V.styleList, "styles");
    done();
  };
})();
</script>
<script src="locales/manifest.js"></script>
<script src="styles/manifest.js"></script>
<script>VERSUS._load();</script>

<style>
  html.boot{visibility:hidden}
  :root{
    --radius:14px; --shadow:0 1px 2px rgba(20,32,43,.05), 0 8px 24px -12px rgba(20,32,43,.18);
    --shadow-lift:0 2px 6px rgba(20,32,43,.08), 0 18px 40px -16px rgba(20,32,43,.30);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(1200px 600px at 82% -10%, var(--paper-glow) 0%, transparent 60%), var(--paper);
    min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  #boot-fail{font-family:system-ui,sans-serif;max-width:480px;margin:15vh auto;padding:0 20px;text-align:center;color:#333;visibility:visible}
  #boot-fail .sign{font-size:42px}
  #boot-fail code{background:#eee;border-radius:4px;padding:1px 5px}
  #boot-fail .paths{font-family:ui-monospace,monospace;font-size:12px;color:#888;overflow-wrap:anywhere}
  .wrap{max-width:840px;margin:0 auto;padding:32px 22px 80px}
  .screen{display:none;animation:rise .35s cubic-bezier(.2,.7,.3,1) both}
  .screen.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:20px 22px 0;max-width:860px;margin:0 auto}
  .word{font-family:var(--serif);font-size:var(--fs-title);font-weight:700;color:var(--title-purple);letter-spacing:.01em;justify-self:center}
  .word::after{content:".";color:var(--accent)}
  .icon-btn{width:40px;height:40px;border-radius:50%;background:none;border:1px solid transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
  .icon-btn:hover{color:var(--accent);border-color:var(--line)}
  .icon-btn svg{width:20px;height:20px}
  #lists-toggle{justify-self:start}
  #gear{justify-self:end}

  .q-heading{width:100%;border:0;outline:0;background:transparent;color:var(--question-teal);
    font:italic 700 min(var(--fs-question),7.5vw)/1.3 var(--serif);text-align:center;margin:20px 0 24px;padding:4px 8px;
    border-bottom:2px dashed transparent;transition:border-color .2s;resize:none;overflow:hidden;display:block}
  .q-heading::placeholder{color:var(--faint)}
  .q-heading:hover{border-bottom-color:var(--line)}
  .q-heading:focus{border-bottom-color:var(--accent)}

  .entry-label{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:var(--fs-label);letter-spacing:.08em;color:var(--muted);font-variant:small-caps;margin:24px 0 0}
  .count{font-variant:normal;letter-spacing:0;font-family:var(--serif);font-size:var(--fs-fine);color:var(--faint);font-style:italic}
  .count .n{color:var(--ink);font-weight:700}
  .count .rm{color:var(--faint)}
  #items{
    width:100%;min-height:240px;resize:vertical;font-family:var(--serif);font-size:var(--fs-input);line-height:2;color:var(--ink);
    background:transparent;border:0;border-top:1px solid var(--ink);border-radius:0;padding:10px 0;outline:none;
    background-image:repeating-linear-gradient(transparent,transparent calc(var(--fs-input)*2 - 1px),var(--line) calc(var(--fs-input)*2));
    background-position:0 10px;background-attachment:local;
  }
  #items::placeholder{color:var(--faint)}
  #items:focus{border-top-color:var(--accent)}

  .q-input{
    width:100%;font-family:var(--serif);font-size:15px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:6px;padding:10px 14px;outline:none;transition:border-color .15s;
  }
  .q-input:focus{border-color:var(--accent)}

  .methods{border-top:1px solid var(--ink);margin-top:34px;padding-top:16px}
  .m-grid{display:grid;grid-template-columns:auto repeat(3,minmax(96px,auto));gap:12px 26px;align-items:baseline;justify-content:start}
  .m-label{font-size:var(--fs-label);letter-spacing:.08em;color:var(--muted);font-variant:small-caps}
  .m-opt{background:none;border:none;cursor:pointer;text-align:center;padding:0;font-family:var(--serif);color:var(--muted)}
  .m-opt b{display:inline-block;font-size:var(--fs-item);font-weight:700;color:var(--muted);padding-bottom:3px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
  .m-opt.active b{color:var(--ink);border-color:var(--accent)}
  .m-num{text-align:center;font-size:var(--fs-label);color:var(--faint);font-variant-numeric:tabular-nums}
  .m-num.active{color:var(--ink)}

  .begin-row{display:flex;align-items:center;gap:24px;margin-top:38px;flex-wrap:wrap}
  .begin{font-family:var(--serif);font-weight:700;font-size:var(--fs-btn);color:var(--on-primary);background:var(--primary);border:none;padding:14px 38px;cursor:pointer;letter-spacing:.02em;transition:background .2s,transform .12s}
  .begin:hover{background:var(--primary-ink)}
  .begin:active{transform:scale(.985)}
  .text-link{font-family:var(--serif);font-size:var(--fs-lede);color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
  .text-link:hover{color:var(--accent)}

  button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;font-family:var(--serif);font-size:var(--fs-label);font-weight:700;padding:9px 16px;border-radius:3px;border:1px solid var(--line-strong);background:transparent;color:var(--primary-ink);transition:transform .12s,border-color .15s,background .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
  .btn.primary:hover{background:var(--primary-ink);color:var(--on-primary)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--accent)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn svg{width:16px;height:16px;flex:none}
  .file-btn{position:relative;overflow:hidden}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
  .err{color:var(--err);font-size:14px;margin-top:12px;min-height:1.2em;font-weight:500}

  .count-line{font-family:var(--serif);font-style:italic;font-size:var(--fs-meta);color:var(--faint);text-align:center;padding-top:30px}
  .count-line b{color:var(--muted);font-weight:700}

  .ask{font-family:var(--serif);font-style:italic;font-weight:700;font-size:min(var(--fs-question),7.5vw);line-height:1.3;color:var(--question-teal);text-align:center;max-width:26ch;margin:12px auto 54px;overflow-wrap:anywhere;text-wrap:balance}

  .verdict{display:grid;grid-template-columns:1fr 1px 1fr;align-items:stretch;max-width:960px;margin:0 auto}
  .verdict .mid{background:var(--line)}
  .verdict .mid i{display:none}
  .plea{background:none;border:none;cursor:pointer;padding:30px 34px;font-family:var(--serif);font-size:min(var(--fs-option),6.5vw);line-height:1.3;color:var(--ink);text-align:center;position:relative;transition:color .15s;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
  .plea:hover{color:var(--accent)}
  .plea .u{position:absolute;inset-inline:16%;bottom:16px;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:0 0;transition:transform .25s cubic-bezier(.2,.8,.3,1);border-radius:2px}
  .plea.pick .u{transform:scaleX(1)}
  .plea.chosen{color:var(--accent-deep)}
  .plea.chosen .u{transform:scaleX(1);height:5px}
  #screen-compare.simple .equal-btn{display:none}

  .compare-actions{display:flex;justify-content:center;align-items:baseline;gap:34px;margin-top:52px}
  .equal-btn{background:none;border:none;font-family:var(--serif);font-style:italic;font-size:var(--fs-btn);color:var(--muted);cursor:pointer;text-decoration:underline dotted;text-underline-offset:5px}
  .equal-btn:hover{color:var(--accent)}
  .equal-btn.chosen{color:var(--accent-deep)}

  .res-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:26px 0 2px}
  .results-title{font-family:var(--serif);font-weight:700;font-size:var(--fs-results-title)}
  .ask-small{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:var(--fs-lede);margin-inline-start:auto}
  .ask-small::before{content:"\201C"}
  .ask-small::after{content:"\201D"}
  .done-stat{font-family:var(--serif);font-style:italic;font-size:var(--fs-meta);color:var(--faint)}
  .done-stat b{color:var(--muted)}
  .tools{display:flex;flex-wrap:wrap;gap:26px;align-items:baseline;margin:12px 0 6px}

  .ranklist{list-style:none;padding:0;margin:0}
  .lrow{display:grid;grid-template-columns:46px 1fr auto auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
  .lrow .stamp{width:38px;height:38px;border:2px solid var(--accent);color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:16px;transform:rotate(-4deg);font-variant-numeric:tabular-nums;flex:none}
  .lrow.first .stamp{background:var(--accent);color:var(--on-primary)}
  .lrow.tie .stamp{border-style:dashed}
  .lrow .name{font-family:var(--serif);font-size:var(--fs-item);color:var(--ink);overflow-wrap:anywhere;min-width:0}
  .lrow .score{font-family:var(--serif);font-size:var(--fs-lede);color:var(--muted);font-variant-numeric:tabular-nums}

  .check{position:relative;width:26px;height:26px;flex:none;cursor:pointer}
  .check input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
  .check .box{width:24px;height:24px;border:1.5px solid var(--line-strong);border-radius:3px;background:transparent;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .check .box svg{width:15px;height:15px;stroke:var(--on-primary);stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
  .check input:hover + .box{border-color:var(--primary)}
  .check input:focus-visible + .box{box-shadow:0 0 0 3px var(--primary-soft)}
  .check input:checked + .box{background:var(--primary);border-color:var(--primary)}
  .check input:checked + .box svg{opacity:1;transform:scale(1)}
  .lrow.done{color:var(--faint)}
  .lrow.done .name{text-decoration:line-through;color:var(--faint)}
  .lrow.done .stamp{border-color:var(--faint);color:var(--faint);background:none}
  .lrow.hidden{display:none}

  .empty{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:var(--fs-lede);text-align:center;padding:30px;border:1px dashed var(--line-strong)}
  .footnote{margin-top:26px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:var(--fs-fine);line-height:1.7;max-width:66ch}

  #lists-sidebar{position:fixed;top:0;inset-inline-start:0;height:100%;width:280px;background:var(--paper);border-inline-end:1px solid var(--line);z-index:55;padding:16px 16px 30px;overflow-y:auto;display:none}
  #lists-sidebar.open{display:block}
  .sb-actions{display:flex;gap:8px;margin-top:8px}
  .sb-actions .btn{flex:1}
  #saved-lists{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
  .list-item{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;transition:border-color .15s,box-shadow .15s}
  .list-item:hover{border-color:var(--line-strong)}
  .list-item.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .li-main{flex:1;min-width:0;cursor:pointer}
  .li-name{font-size:var(--fs-label);font-weight:600;color:var(--ink);overflow-wrap:anywhere}
  .li-main:hover .li-name{color:var(--primary-ink)}
  .li-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:1px}
  @media (min-width:900px){ body.sidebar-open{padding-inline-start:280px} }
  #customize{position:fixed;top:0;inset-inline-end:0;height:100%;width:min(360px,92vw);background:var(--paper);border-inline-start:1px solid var(--line);z-index:60;padding:18px 20px 40px;overflow-y:auto}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-title{font-family:var(--display);font-weight:700;font-size:18px;color:var(--primary-ink)}
  .panel-close{font-size:22px;line-height:1;color:var(--faint);padding:4px 8px;border-radius:8px}
  .panel-close:hover{color:var(--primary-ink);background:var(--primary-soft)}
  #customize details{border-top:1px solid var(--line);padding:10px 0}
  #customize summary{font-size:var(--fs-label);font-weight:600;color:var(--primary-ink);cursor:pointer;padding:4px 0;list-style-position:outside}
  #customize details.sub{border-top:none;padding:4px 0 0;margin:12px 0 0 10px}
  #customize details.sub summary{font-style:italic;font-weight:400;color:var(--muted)}
  #customize details.sub[open] summary{color:var(--primary-ink)}
  #customize .panel-section{padding:10px 2px 6px}
  #customize select.q-input{padding:9px 12px}
  .ctl-group{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px}
  .ctl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 0;font-size:var(--fs-label);color:var(--muted);cursor:pointer}
  .ctl-row input[type=color]{width:36px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:1px;cursor:pointer;flex:none}
  .ctl-row select.ctl-select{max-width:170px;font-family:var(--sans);font-size:var(--fs-label);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .ctl-row input.ctl-num{width:74px;font-family:var(--mono);font-size:var(--fs-label);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .ctl-reset{margin-top:14px;width:100%}
  .save-row{display:flex;gap:8px;align-items:center}
  #sec-style .save-row{margin-top:10px}
  .save-row .q-input{flex:1;min-width:0}
  #custom-style-list{list-style:none;padding:0;margin:10px 0 0}
  .style-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:var(--fs-label);color:var(--ink)}
  .style-item-name{flex:1;min-width:0;overflow-wrap:anywhere}
  .rename-input{flex:1;min-width:0;padding:4px 8px;font-size:var(--fs-label)}
  .mini-btn{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--panel)}
  .mini-btn:hover{color:var(--primary-ink);border-color:var(--primary)}
  .mini-btn.danger:hover{color:var(--err);border-color:var(--err)}
  #ovr-filter{margin-bottom:10px}
  .ovr-row{padding:5px 0}
  .ovr-key{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:3px}
  .ovr-row.changed .ovr-key{color:var(--accent-deep);font-weight:700}
  .ovr-input{width:100%;font-family:var(--sans);font-size:var(--fs-label);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;resize:vertical}
  .ovr-row.changed .ovr-input{border-color:var(--accent)}
  .share-col{display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .share-msg{font-size:var(--fs-fine);color:var(--muted);min-height:1.2em}
  #notice{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:min(480px,90vw);background:var(--primary-ink);color:var(--on-primary);font-size:var(--fs-label);border-radius:10px;padding:10px 16px;box-shadow:var(--shadow-lift);z-index:80}

  @media (max-width:700px){
    .wrap{padding:20px 16px 64px}
    .masthead{padding:18px 16px 0}
    .verdict{grid-template-columns:1fr}
    .verdict .mid{background:none;display:flex;align-items:center;gap:14px;padding:6px 26px}
    .verdict .mid::before,.verdict .mid::after{content:"";flex:1;height:1px;background:var(--line)}
    .verdict .mid i{display:block;font-family:var(--serif);font-style:italic;font-size:var(--fs-lede);color:var(--muted)}
    .plea{padding:26px 18px;min-height:110px}
    .m-grid{grid-template-columns:repeat(3,1fr);gap:8px}
    .m-label{grid-column:1 / -1}
    .m-opt b{font-size:var(--fs-lede)}
    .lrow{grid-template-columns:40px 1fr auto auto;gap:10px}
    .lrow .stamp{width:32px;height:32px;font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>

<div id="boot-fail" hidden>
  <div class="sign">&#9888;</div>
  <p>Versus couldn't load its data files. Keep <code>index.html</code> together with its
  <code>locales/</code> and <code>styles/</code> folders, or use a single-file export.</p>
  <p class="paths" id="boot-fail-paths"></p>
</div>

<header class="masthead">
  <button id="lists-toggle" class="icon-btn" data-i18n-title="lists.label" data-i18n-aria-label="lists.label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <span class="word">Priorities</span>
  <button id="gear" class="icon-btn" data-i18n-title="panel.title" data-i18n-aria-label="panel.title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div class="wrap">

  <!-- ============ INPUT ============ -->
  <section id="screen-input" class="screen active">
    <textarea id="question" class="q-heading" rows="1" data-i18n-placeholder="app.defaultQuestion" spellcheck="false" autocomplete="off"></textarea>
    <div class="entry-label"><span data-i18n="input.listLabel"></span><span class="count" id="count"></span></div>

    <div class="methods">
      <div class="m-grid">

        <button class="m-opt active" data-mode="binary" type="button"><b data-i18n="input.modeBinary"></b></button>
        <button class="m-opt" data-mode="sequential" type="button"><b data-i18n="input.modeSequential"></b></button>
        <button class="m-opt" data-mode="simple" type="button"><b data-i18n="input.modeSimple"></b></button>

    <div class="begin-row">
      <button class="begin" id="start" data-i18n="input.start"></button>

        <input type="file" id="file" accept=".txt,text/plain">

  <!-- ============ COMPARE ============ -->
  <section id="screen-compare" class="screen">

    <div class="ask" id="ask"></div>

      </button>
      <div class="mid"><i data-i18n="compare.or"></i></div>
      <button class="plea" id="opt-ranked" data-i18n-aria-label="compare.ariaRanked">

    <div class="compare-actions">

  <!-- ============ RESULTS ============ -->

      <button class="text-link" id="toggle-checked"></button>
      <button class="text-link" id="back-results" data-i18n="results.undoLast"></button>
      <button class="text-link" id="csv" data-i18n="results.csv"></button>

<div id="notice" hidden></div>

<script>
"use strict";
(function(){
  // Pristine source snapshot, captured before ANY mutation. This is what exports are
  // built from — one uniform path that works on both https and file:// (no fetch).
  const PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- persistence ----------
  // Versioned envelopes in localStorage; falls back to an in-memory mirror when
  // storage is disabled (private browsing) or full. Corrupt data is discarded.
  const K_PREFS = "versus.v1.prefs", K_STYLES = "versus.v1.customStyles",
        K_OVR = "versus.v1.stringOverrides", K_LOCALES = "versus.v1.customLocales",
        K_LISTS = "versus.v1.lists", K_WORK = "versus.v1.workspace";
  const STORE = (function(){
    let ok = false;
    try{ localStorage.setItem("versus.probe","1"); localStorage.removeItem("versus.probe"); ok = true; }catch(e){}
    const mem = {};
    return {
      ok,
      get(key, fallback){
        try{
          const raw = ok ? localStorage.getItem(key) : mem[key];
          if(raw == null) return fallback;
          const v = JSON.parse(raw);
          if(!v || typeof v !== "object" || v.schema !== 1) return fallback;
          return v;
        }catch(e){ if(ok) try{ localStorage.removeItem(key); }catch(_){} return fallback; }
      },
      set(key, obj){
        const raw = JSON.stringify(obj);
        mem[key] = raw;
        if(ok) try{ localStorage.setItem(key, raw); }catch(e){ showNotice(t("panel.storageWarn")); }
      }
    };
  })();
  let overrides = {};   // {localeId: {key: value}} — the user's personal localization layer
  function saveOverrides(){ STORE.set(K_OVR, {schema:1, overrides}); }
  function savePrefs(){ STORE.set(K_PREFS, {schema:1, locale:i18n.locale, styleId:theming.styleId, sidebar:sbOpen}); }
  function saveCustomStyles(){
    const styles = {};
    Object.keys(VERSUS.styles).forEach(id=>{ if(VERSUS.styles[id].custom) styles[id] = VERSUS.styles[id]; });
    STORE.set(K_STYLES, {schema:1, styles});
  }
  function saveCustomLocales(){
    const locales = {};
    Object.keys(VERSUS.locales).forEach(id=>{ if(VERSUS.locales[id].custom) locales[id] = VERSUS.locales[id]; });
    STORE.set(K_LOCALES, {schema:1, locales});
  }
  let lists = {};   // {id: {id, name, question, items[], results[]|null, createdAt, updatedAt}}
  function saveLists(){ STORE.set(K_LISTS, {schema:1, lists}); }
  let workTimer = null;
  function queueWorkspaceSave(){
    clearTimeout(workTimer);
    workTimer = setTimeout(()=>{
      STORE.set(K_WORK, {schema:1, items:$("items").value, question:$("question").value, mode:state.mode});
    }, 400);
  }
  let noticeTimer = null;
  function showNotice(msg){
    const n = $("notice"); if(!n) return;
    n.textContent = msg; n.hidden = false;
    clearTimeout(noticeTimer); noticeTimer = setTimeout(()=>{ n.hidden = true; }, 6000);
  }

  // ---------- i18n core ----------
  const PLURAL_RULES = {
    "one-other": n => n === 1 ? "one" : "other",
    "other-only": () => "other",
  };
  const i18n = { locale: null, fallback: null };   // ids
  function activeLocale(){ return VERSUS.locales[i18n.locale]; }
  function resolve(key){
    const ov = overrides[i18n.locale];
    if(ov && ov[key] != null) return ov[key];
    return resolveNoOverride(key);
  }
  function resolveNoOverride(key){
    const cur = VERSUS.locales[i18n.locale], fb = VERSUS.locales[i18n.fallback];
    if(cur && cur.strings[key] != null) return cur.strings[key];
    if(fb && fb.strings[key] != null) return fb.strings[key];
    return key;   // visible marker for a missing key
  }
  function t(key, params){
    let s = resolve(key);
    if(params) for(const k in params) s = s.split("{"+k+"}").join(params[k]);
    // {language} and {style} are implicit variables, usable in any string.
    if(s.indexOf("{language}") >= 0){
      const loc = VERSUS.locales[i18n.locale];
      s = s.split("{language}").join(loc ? (loc.name || i18n.locale) : "");
    }
    if(s.indexOf("{style}") >= 0){
      const st = VERSUS.styles[theming.styleId];
      s = s.split("{style}").join(st ? (st.name || theming.styleId) : "");
    }
    return s;
  }
  function pluralKey(key, n){
    const loc = activeLocale();
    const rule = PLURAL_RULES[loc && loc.plural] || PLURAL_RULES["one-other"];
    return key + "." + rule(n);
  }
  let lastDefaultQ = "";
  // The question heading is a textarea so long questions wrap on phones; it grows to fit.
  function autoGrowQuestion(){
    const q = $("question"); if(!q) return;
    q.style.height = "auto";
    q.style.height = q.scrollHeight + "px";
  }
  function applyStrings(){
    document.title = t("app.title");
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
    document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
    document.querySelectorAll("[data-i18n-aria-label]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAriaLabel)));
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
    // dynamic bits that live in JS
    const q = $("question");
    if(q.value === "" || q.value === lastDefaultQ) q.value = t("app.defaultQuestion");
    lastDefaultQ = t("app.defaultQuestion");
    autoGrowQuestion();
    refreshCount();
    if($("screen-compare").classList.contains("active") && currentPair()) renderCompare();
    if($("screen-results").classList.contains("active") && state.results.length) renderResults();
  }
  function applyLocale(id){
    if(!VERSUS.locales[id]) return false;
    i18n.locale = id;
    const loc = VERSUS.locales[id];
    document.documentElement.lang = id;
    document.documentElement.dir = loc.dir === "rtl" ? "rtl" : "ltr";
    applyStrings();
    buildLocaleSelect(); buildThemeControls(); buildOverrideEditor(); buildSavedLists();
    savePrefs();
    return true;
  }
  function buildLocaleSelect(){
    const sel = $("locale-select"); if(!sel) return;
    sel.innerHTML = "";
    Object.keys(VERSUS.locales).sort().forEach(id=>{
      const o = document.createElement("option");
      o.value = id; o.textContent = VERSUS.locales[id].name || id;
      if(id === i18n.locale) o.selected = true;
      sel.appendChild(o);
    });
  }

  // ---------- theming ----------
  const TOKEN_MAP = {
    colors: {
      paper:"--paper", paperGlow:"--paper-glow", panel:"--panel", ink:"--ink", muted:"--muted",
      faint:"--faint", line:"--line", lineStrong:"--line-strong", primary:"--primary",
      primaryInk:"--primary-ink", primarySoft:"--primary-soft", onPrimary:"--on-primary",
      accent:"--accent", accentDeep:"--accent-deep", accentSoft:"--accent-soft",
      titlePurple:"--title-purple", questionTeal:"--question-teal", doneWash:"--done-wash", err:"--err",
    },
    fonts: { sans:"--sans", display:"--display", serif:"--serif", mono:"--mono" },
    sizes: {
      title:"--fs-title", question:"--fs-question", lede:"--fs-lede", label:"--fs-label",
      input:"--fs-input", btn:"--fs-btn", option:"--fs-option", item:"--fs-item",
      resultsTitle:"--fs-results-title", meta:"--fs-meta", fine:"--fs-fine",
    },
  };
  const theming = { styleId: null, fallbackId: null, resolved: {}, edits: {}, gf: [] };
  function styleTokens(def){
    const out = {};
    for(const group in TOKEN_MAP){
      const src = def[group] || {};
      for(const k in TOKEN_MAP[group]) if(src[k] != null) out[TOKEN_MAP[group][k]] = src[k];
    }
    return out;
  }
  function applyStyle(id){
    const def = VERSUS.styles[id]; if(!def) return false;
    theming.styleId = id;
    theming.edits = {};
    const fb = VERSUS.styles[theming.fallbackId];
    theming.resolved = Object.assign({}, fb ? styleTokens(fb) : {}, styleTokens(def));
    theming.gf = (def.googleFonts || (fb && fb.googleFonts) || []).slice();
    repaint();
    buildThemeControls();
    refreshPanelLabels();   // "Edit {style}" tracks the active style's name
    savePrefs();
    return true;
  }
  function refreshPanelLabels(){
    document.querySelectorAll("#customize [data-i18n]").forEach(el=> el.textContent = t(el.dataset.i18n));
  }
  function currentTokens(){ return Object.assign({}, theming.resolved, theming.edits); }
  function repaint(){
    const root = document.documentElement.style;
    for(const g in TOKEN_MAP) for(const k in TOKEN_MAP[g]) root.removeProperty(TOKEN_MAP[g][k]);
    const cur = currentTokens();
    for(const v in cur) root.setProperty(v, cur[v]);
    refreshFontLink();
  }
  function refreshFontLink(){
    let link = $("google-fonts");
    if(theming.gf.length){
      if(!link){ link = document.createElement("link"); link.id = "google-fonts"; link.rel = "stylesheet"; document.head.appendChild(link); }
      link.href = "https://fonts.googleapis.com/css2?" + theming.gf.map(f => "family=" + f).join("&") + "&display=swap";
    } else if(link) link.remove();
  }
  function editToken(cssVar, value){
    theming.edits[cssVar] = value;
    document.documentElement.style.setProperty(cssVar, value);
  }
  function toHex(v){
    v = (v || "").trim();
    if(/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
    const d = document.createElement("div");
    d.style.color = v; document.body.appendChild(d);
    const m = getComputedStyle(d).color.match(/\d+/g); d.remove();
    if(!m) return "#000000";
    return "#" + m.slice(0,3).map(x => (+x).toString(16).padStart(2,"0")).join("");
  }

  // ---------- theme editor ----------
  // Curated font stacks: always-safe system stacks plus the Google fonts styles already use.
  const FONT_CHOICES = [
    { label:"System sans",         stack:'system-ui,-apple-system,"Segoe UI",sans-serif' },
    { label:"System serif",        stack:'Georgia,"Times New Roman",serif' },
    { label:"System mono",         stack:'ui-monospace,Consolas,Menlo,monospace' },
    { label:"Inter",               stack:'"Inter",system-ui,-apple-system,sans-serif', gf:"Inter:wght@400;450;500;600" },
    { label:"Bricolage Grotesque", stack:'"Bricolage Grotesque","Inter",system-ui,sans-serif', gf:"Bricolage+Grotesque:opsz,wght@12..96,400..800" },
    { label:"Playfair Display",    stack:'"Playfair Display",Georgia,"Times New Roman",serif', gf:"Playfair+Display:ital,wght@0,500..800;1,500..800" },
    { label:"JetBrains Mono",      stack:'"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace', gf:"JetBrains+Mono:wght@400;500;700" },
    { label:"Verdana",             stack:'Verdana,Geneva,sans-serif' },
    { label:"Trebuchet MS",        stack:'"Trebuchet MS",Tahoma,sans-serif' },
  ];
  function buildStyleSelect(){
    const sel = $("style-select"); if(!sel) return;
    sel.innerHTML = "";
    Object.keys(VERSUS.styles).sort().forEach(id=>{
      const o = document.createElement("option");
      o.value = id; o.textContent = VERSUS.styles[id].name || id;
      if(id === theming.styleId) o.selected = true;
      sel.appendChild(o);
    });
  }
  function ctlRow(parent, labelText){
    const row = document.createElement("label"); row.className = "ctl-row";
    const span = document.createElement("span"); span.textContent = labelText;
    row.appendChild(span); parent.appendChild(row);
    return row;
  }
  function groupLabel(parent, key){
    const h = document.createElement("div"); h.className = "ctl-group";
    h.textContent = t(key); parent.appendChild(h);
  }
  function buildThemeControls(){
    if(!$("color-controls")) return;
    buildStyleSelect();
    const cur = currentTokens();

    const colors = $("color-controls"); colors.innerHTML = "";
    groupLabel(colors, "panel.colors");
    for(const k in TOKEN_MAP.colors){
      const cssVar = TOKEN_MAP.colors[k];
      const row = ctlRow(colors, t("color." + k));
      const inp = document.createElement("input"); inp.type = "color";
      inp.value = toHex(cur[cssVar]);
      inp.addEventListener("input", ()=> editToken(cssVar, inp.value));
      row.appendChild(inp);
    }

    const fonts = $("font-controls"); fonts.innerHTML = "";
    groupLabel(fonts, "panel.fonts");
    for(const k in TOKEN_MAP.fonts){
      const cssVar = TOKEN_MAP.fonts[k];
      const row = ctlRow(fonts, t("font." + k));
      const sel = document.createElement("select"); sel.className = "ctl-select";
      const curStack = cur[cssVar] || "";
      let matched = false;
      FONT_CHOICES.forEach((c, i)=>{
        const o = document.createElement("option");
        o.value = i; o.textContent = c.label;
        if(c.stack === curStack){ o.selected = true; matched = true; }
        sel.appendChild(o);
      });
      if(!matched){
        const o = document.createElement("option");
        o.value = "current"; o.textContent = "•"; o.selected = true;
        sel.insertBefore(o, sel.firstChild);
      }
      sel.addEventListener("change", ()=>{
        const c = FONT_CHOICES[+sel.value]; if(!c) return;
        if(c.gf && !theming.gf.includes(c.gf)){ theming.gf.push(c.gf); refreshFontLink(); }
        editToken(cssVar, c.stack);
      });
      row.appendChild(sel);
    }

    const sizes = $("size-controls"); sizes.innerHTML = "";
    groupLabel(sizes, "panel.sizes");
    for(const k in TOKEN_MAP.sizes){
      const cssVar = TOKEN_MAP.sizes[k];
      const row = ctlRow(sizes, t("size." + k));
      const inp = document.createElement("input"); inp.type = "number";
      inp.className = "ctl-num"; inp.min = 8; inp.max = 96; inp.step = 0.5;
      inp.value = parseFloat(cur[cssVar]) || "";
      inp.addEventListener("input", ()=>{ if(inp.value) editToken(cssVar, inp.value + "px"); });
      row.appendChild(inp);
    }

    buildCustomStyleList();
  }

  // ---------- named custom styles ----------
  function slug(name){ return name.toLowerCase().replace(/[^a-z0-9À-ɏ؀-ۿ]+/g,"-").replace(/^-+|-+$/g,"") || "style"; }
  function tokensToStyleDef(id, name){
    const cur = currentTokens();
    const def = { id, name, custom:true, colors:{}, fonts:{}, sizes:{}, googleFonts: theming.gf.slice() };
    for(const g in TOKEN_MAP) for(const k in TOKEN_MAP[g]){
      const v = cur[TOKEN_MAP[g][k]];
      if(v != null) def[g][k] = v;
    }
    return def;
  }
  function saveStyleAs(name){
    let id = slug(name);
    while(VERSUS.styles[id] && !VERSUS.styles[id].custom) id += "-custom";
    VERSUS.registerStyle(id, tokensToStyleDef(id, name));
    saveCustomStyles();
    applyStyle(id);
  }
  function deleteStyle(id){
    if(!VERSUS.styles[id] || !VERSUS.styles[id].custom) return;
    delete VERSUS.styles[id];
    saveCustomStyles();
    if(theming.styleId === id){
      const ids = Object.keys(VERSUS.styles);
      applyStyle(pick(VERSUS.config.defaultStyle || VERSUS.defaultStyle, ids));
    } else buildThemeControls();
  }
  function buildCustomStyleList(){
    const ul = $("custom-style-list"); if(!ul) return;
    ul.innerHTML = "";
    Object.keys(VERSUS.styles).filter(id=>VERSUS.styles[id].custom).sort().forEach(id=>{
      const li = document.createElement("li"); li.className = "style-item";
      const span = document.createElement("span"); span.className = "style-item-name";
      span.textContent = VERSUS.styles[id].name || id;
      const ren = miniBtn(t("panel.rename"), ()=>{
        const inp = document.createElement("input");
        inp.type = "text"; inp.className = "q-input rename-input";
        inp.value = VERSUS.styles[id].name || id;
        li.replaceChild(inp, span);
        inp.focus(); inp.select();
        let settled = false;
        const commit = ()=>{
          if(settled) return; settled = true;
          const name = inp.value.replace(/\s+/g," ").trim();
          if(name && name !== VERSUS.styles[id].name){
            VERSUS.styles[id].name = name;
            saveCustomStyles();
            buildThemeControls(); refreshPanelLabels();
          } else buildCustomStyleList();
        };
        inp.addEventListener("blur", commit);
        inp.addEventListener("keydown", ev=>{
          if(ev.key === "Enter"){ ev.preventDefault(); commit(); }
          else if(ev.key === "Escape"){ inp.value = ""; commit(); }
        });
      });
      const del = miniBtn(t("panel.delete"), ()=> deleteStyle(id), "danger");
      li.appendChild(span); li.appendChild(ren); li.appendChild(del);
      ul.appendChild(li);
    });
  }

  // ---------- shareable .json artifacts (pure data — validated, never executed) ----------
  // Import feedback surfaces in the panel's message line AND as a toast, since
  // imports can now also start from the lists sidebar with the panel closed.
  function shareMsg(msg){

  // ---------- site export (single HTML / ZIP) ----------
  // Markers are built by concatenation so the contiguous marker string never appears
  // in this code (the exporter would otherwise find itself — the quine trap).
  const M_BEGIN = "<!--VERSUS:DATA:" + "BEGIN-->";
  const M_END = "<!--VERSUS:DATA:" + "END-->";
  function buildShell(dataObj){
    let src = PRISTINE.replace(/<script[^>]*data-versus-injected[^>]*><\/script>\s*/g, "");
    const json = JSON.stringify(dataObj).replace(/</g, "\\u003c");
    const block = M_BEGIN + '\n<scr' + 'ipt type="application/json" id="versus-data">' + json + '</scr' + 'ipt>\n' + M_END;
    const i0 = src.indexOf(M_BEGIN), i1 = src.indexOf(M_END);
    if(i0 < 0 || i1 <= i0) return null;
    if(src.indexOf(M_BEGIN, i0 + M_BEGIN.length) >= 0 || src.indexOf(M_END, i1 + M_END.length) >= 0) return null;
    const out = src.slice(0, i0) + block + src.slice(i1 + M_END.length);
    try{ JSON.parse(json); }catch(e){ return null; }
    return out;
  }
  function exportedLocale(id){
    const loc = VERSUS.locales[id];

  }
  function exportedStyle(id){
    const s = VERSUS.styles[id];

    ["colors","fonts","sizes"].forEach(g=>{ if(s[g] && Object.keys(s[g]).length) def[g] = s[g]; });

  // Store-only ZIP writer (no compression, no libraries): local headers + central directory.
  function crc32(buf){
    let table = crc32.table;
    if(!table){
      table = crc32.table = new Int32Array(256);
      for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); table[n]=c; }
    }
    let c = ~0;
    for(let i=0;i<buf.length;i++) c = (c>>>8) ^ table[(c ^ buf[i]) & 0xFF];
    return ~c >>> 0;
  }
  function makeZip(files){   // files: [{name, text}]
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    files.forEach(f=>{
      const nameB = enc.encode(f.name), data = enc.encode(f.text);
      const crc = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true);          // UTF-8 names
      local.setUint16(8, 0, true);               // method: store
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, nameB.length, true);
      parts.push(local.buffer, nameB, data);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, data.length, true);
      cd.setUint32(24, data.length, true);
      cd.setUint16(28, nameB.length, true);
      cd.setUint32(42, offset, true);
      central.push(cd.buffer, nameB);
      offset += 30 + nameB.length + data.length;
    });
    const cdSize = central.reduce((s,b)=> s + b.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end.buffer]), {type:"application/zip"});
  }

  // ---------- saved lists (sidebar) ----------
  function uniqueListId(base){ let id = base, n = 1; while(lists[id]) id = base + "-" + (++n); return id; }
  const sameItems = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
  function snapshotResults(){
    return state.results.map(r => ({item:r.item, rank:r.rank, score:r.score, tie:!!r.tie, done:!!r.done}));
  }
  function saveCurrentList(name){
    let id = Object.keys(lists).find(k => lists[k].name === name) || null;
    const now = new Date().toISOString();
    const created = (id && lists[id].createdAt) || now;
    if(!id) id = uniqueListId(slug(name));
    const onResults = $("screen-results").classList.contains("active") && state.results.length;
    const items = onResults ? state.items.slice() : parseItems($("items").value).items;
    const question = onResults ? state.question
      : ($("question").value.replace(/\s+/g," ").trim() || t("app.defaultQuestion"));
    let results = null;
    if(onResults) results = snapshotResults();
    else if(state.listId === id && lists[id] && lists[id].results && sameItems(items, lists[id].items))
      results = lists[id].results;   // saving unchanged inputs keeps the stored ranking
    lists[id] = {id, name, question, items, results, createdAt: created, updatedAt: now};
    state.listId = id;
    saveLists(); buildSavedLists();
    showNotice(t("lists.saved", {name}));
  }
  // A loaded list stays connected: finished rankings and done-ticks write back automatically.
  function syncLoadedList(){
    const l = state.listId && lists[state.listId];
    if(!l) return;
    l.items = state.items.slice();
    l.question = state.question;
    l.results = snapshotResults();
    l.updatedAt = new Date().toISOString();
    saveLists(); buildSavedLists();
  }
  function loadList(id){
    const l = lists[id]; if(!l) return;
    state.listId = id;
    $("items").value = l.items.join("\n");
    $("question").value = l.question || "";
    $("list-name").value = l.name;
    autoGrowQuestion(); refreshCount(); queueWorkspaceSave();
    if(l.results && l.results.length){
      state.items = l.items.slice();
      state.question = l.question || t("app.defaultQuestion");
      state.results = l.results.map(r => Object.assign({}, r));
      state.comparisons = []; state.history = []; state.current = null;
      show("results"); renderResults();
    } else {
      show("input");
    }
    buildSavedLists();
    if(matchMedia("(max-width:899px)").matches) setSidebar(false);
  }

  function importList(raw){
    let name = String(raw.name || "list");
    const items = Array.isArray(raw.items)
      ? parseItems(raw.items.filter(v => typeof v === "string").join("\n")).items
      : [];
    if(items.length === 0) return shareMsg(t("panel.importErr"));
    const question = typeof raw.question === "string" ? raw.question : "";
    let results = null, ignored = 0;
    if(Array.isArray(raw.results) && raw.results.length === items.length){
      const itemSet = new Set(items);
      const rows = raw.results.filter(r => r && typeof r === "object" && itemSet.has(r.item)
        && Number.isFinite(r.rank) && Number.isFinite(r.score));
      if(rows.length === items.length)
        results = rows.map(r => ({item:r.item, rank:r.rank, score:r.score, tie:!!r.tie, done:!!r.done}))
                      .sort((a,b) => a.rank - b.rank);
      else ignored++;
    } else if(raw.results != null) ignored++;
    while(Object.keys(lists).some(k => lists[k].name === name)) name += " (2)";
    const id = uniqueListId(slug(name));
    const now = new Date().toISOString();
    lists[id] = {id, name, question, items, results,
      createdAt: typeof raw.createdAt === "string" ? raw.createdAt : now, updatedAt: now};
    saveLists();
    loadList(id);   // imported lists load immediately, same as imported styles/locales apply

  // ---------- per-string override editor ("personal localization") ----------
  function buildOverrideEditor(){
    const list = $("ovr-list"); if(!list) return;
    list.innerHTML = "";

      const row = document.createElement("div");

      const multi = baseVal.includes("\n");
      const inp = document.createElement(multi ? "textarea" : "input");
      if(multi) inp.rows = 3; else inp.type = "text";
      inp.className = "ovr-input";
      inp.value = ov[key] != null ? ov[key] : baseVal;
      inp.addEventListener("input", ()=>{
        if(inp.value === resolveNoOverride(key)){
          if(overrides[i18n.locale]) delete overrides[i18n.locale][key];
          row.classList.remove("changed");

          (overrides[i18n.locale] = overrides[i18n.locale] || {})[key] = inp.value;
          row.classList.add("changed");

  const state = {
    items: [], question: "", mode: "binary", listId: null,
    sorted: [], remaining: [], current: null,
    lo: 0, hi: 0, pos: 0,                 // lo/hi = binary bounds; pos = sequential cursor
    si: 0, sj: 1,                         // simple (all-pairs) cursors: items[si] vs items[sj]
    comparisons: [], history: [], estTotal: 1,
    results: [], showChecked: true, locked: false,   // done items stay visible so ranks never skip
  };

  // ---------- Input parsing ----------
  function parseItems(text){
    const seen = new Set(); const out = []; let dupes = 0;
    text.split(/\r?\n/).forEach(line=>{
      const t = line.replace(/\s+/g," ").trim();
      if(!t) return;
      const key = t.toLowerCase();
      if(seen.has(key)){ dupes++; return; }
      seen.add(key); out.push(t);
    });
    return { items: out, dupes };
  }
  function refreshCount(){
    const { items, dupes } = parseItems($("items").value);
    let s = esc(t(pluralKey("input.countItems", items.length)))
      .split("{n}").join('<span class="n">' + items.length + '</span>');
    if(dupes) s += ' <span class="rm">' + esc(t(pluralKey("input.countDupes", dupes), {n:dupes})) + '</span>';
    $("count").innerHTML = s;
    renderMethodCounts();   // comparison counts under each sorting method are live
  }
  function renderMethodCounts(){
    if(!$("n-binary")) return;
    const n = parseItems($("items").value).items.length;
    [["n-binary","binary",false],["n-sequential","sequential",false],["n-simple","simple",true]].forEach(([id, mode, exact])=>{
      const c = n > 1 ? estComparisons(n, mode) : 0;
      $(id).textContent = (exact || c === 0 ? "" : "~") + c;
      $(id).classList.toggle("active", state.mode === mode);
    });
    document.querySelectorAll(".m-opt").forEach(b=> b.classList.toggle("active", b.dataset.mode === state.mode));
  }

  // expected comparison count, per mode (exact for simple; an estimate otherwise)
  function estComparisons(n, mode){
    if(mode === "simple") return Math.max(1, n*(n-1)/2);
    let c = 0;
    for(let k=1;k<n;k++) c += (mode==="sequential") ? (k/2 + k/(k+1)) : Math.ceil(Math.log2(k+1));
    return Math.max(1, Math.round(c));
  }

  // ---------- Sort engine (binary OR sequential insertion, as a resumable machine) ----------
  function beginSort(){
    const { items } = parseItems($("items").value);
    if(items.length < 2){ $("input-err").textContent = t("input.errTooFew"); return; }
    const q = $("question").value.replace(/\s+/g," ").trim();
    state.question = q || t("app.defaultQuestion");
    state.items = items.slice();
    state.comparisons = []; state.history = [];
    state.estTotal = estComparisons(items.length, state.mode);
    if(state.mode === "simple"){
      state.si = 0; state.sj = 1;
      state.sorted = []; state.remaining = []; state.current = null;
    } else {
      state.sorted = [items[0]];
      state.remaining = items.slice(1);
      nextItem();
    }
    show("compare");
    renderCompare();
  }
  function nextItem(){
    if(state.remaining.length === 0){ state.current = null; return finishSort(); }
    state.current = state.remaining.shift();
    state.lo = 0; state.hi = state.sorted.length; state.pos = 0;
    return false;
  }
  function currentPair(){
    if(state.mode === "simple"){
      if(state.si >= state.items.length - 1) return null;
      return { a: state.items[state.si], b: state.items[state.sj], idx: state.sj, aIdx: state.si };
    }
    if(state.current == null) return null;
    const idx = state.mode === "sequential" ? state.pos : (state.lo + state.hi) >> 1;
    return { a: state.current, b: state.sorted[idx], idx };
  }
  function snapshot(){
    state.history.push(JSON.stringify({
      sorted:state.sorted, remaining:state.remaining, current:state.current,
      lo:state.lo, hi:state.hi, pos:state.pos, si:state.si, sj:state.sj, comparisons:state.comparisons
    }));
  }
  function applyAnswer(res){                 // res: 'a'(anchor higher) | 'b'(other higher) | 'draw'
    const p = currentPair(); if(!p) return;
    snapshot();
    state.comparisons.push({ a: p.a, b: p.b, result: res });
    if(state.mode === "simple"){
      state.sj++;
      if(state.sj >= state.items.length){ state.si++; state.sj = state.si + 1; }
      if(state.si >= state.items.length - 1) return finishSort();
      return false;
    }
    if(state.mode === "sequential"){
      if(res === "draw"){ state.sorted.splice(p.idx + 1, 0, state.current); return nextItem(); }
      if(res === "a"){ state.sorted.splice(p.idx, 0, state.current); return nextItem(); } // above this rank
      state.pos++;                                                                        // below → keep walking
      if(state.pos >= state.sorted.length){ state.sorted.push(state.current); return nextItem(); }
      return false;
    }
    // binary
    if(res === "draw"){ state.sorted.splice(p.idx + 1, 0, state.current); return nextItem(); }
    if(res === "a") state.hi = p.idx; else state.lo = p.idx + 1;
    if(state.lo >= state.hi){ state.sorted.splice(state.lo, 0, state.current); return nextItem(); }
    return false;
  }
  function undo(){
    if(state.history.length === 0) return;
    Object.assign(state, JSON.parse(state.history.pop()));
    show("compare"); renderCompare();
  }

  // ---------- Bradley–Terry (MM / Zermelo) + phantom regularization ----------
  const REG = 1.0, SPREAD = 25, ITERS = 500;
  function bradleyTerry(items, comparisons){
    const idx = new Map(items.map((it,i)=>[it,i])); const n = items.length;
    const W = new Array(n).fill(REG/2); const games = Array.from({length:n},()=>new Map());
    for(const {a,b,result} of comparisons){
      const ia = idx.get(a), ib = idx.get(b);
      games[ia].set(ib,(games[ia].get(ib)||0)+1); games[ib].set(ia,(games[ib].get(ia)||0)+1);
      if(result==="a") W[ia]+=1; else if(result==="b") W[ib]+=1; else { W[ia]+=0.5; W[ib]+=0.5; }
    }
    let p = new Array(n).fill(1);
    for(let t=0;t<ITERS;t++){
      const np = new Array(n); let maxd=0;
      for(let i=0;i<n;i++){ let d = REG/(p[i]+1); for(const [j,nij] of games[i]) d += nij/(p[i]+p[j]); np[i] = W[i]/d; }
      const gm = Math.exp(np.reduce((s,v)=>s+Math.log(v),0)/n);
      for(let i=0;i<n;i++){ np[i]/=gm; maxd=Math.max(maxd,Math.abs(np[i]-p[i])); }
      p = np; if(maxd < 1e-12) break;
    }
    const beta = p.map(v=>Math.log(v)); const mean = beta.reduce((s,v)=>s+v,0)/n; const rating = {};
    items.forEach((it,i)=> rating[it] = 100 + SPREAD*(beta[i]-mean));
    return rating;
  }
  function isotonicWeighted(vals, wts){
    const val=[], wt=[], idxs=[];
    for(let i=0;i<vals.length;i++){
      let cv=vals[i], cw=wts[i], ci=[i];
      while(val.length && val[val.length-1] < cv){
        const pv=val.pop(), pw=wt.pop(), pi=idxs.pop();
        cv=(pv*pw + cv*cw)/(pw+cw); cw=pw+cw; ci=pi.concat(ci);
      }
      val.push(cv); wt.push(cw); idxs.push(ci);
    }
    const out=new Array(vals.length);
    for(let k=0;k<val.length;k++) for(const i of idxs[k]) out[i]=val[k];
    return out;
  }
  function tieGroups(items, comparisons){
    const parent = new Map(items.map(it=>[it,it]));
    const find = x => { while(parent.get(x)!==x){ parent.set(x,parent.get(parent.get(x))); x=parent.get(x);} return x; };
    const union = (a,b)=>{ const ra=find(a), rb=find(b); if(ra!==rb) parent.set(ra,rb); };
    comparisons.forEach(c=>{ if(c.result==="draw") union(c.a,c.b); });
    return find;
  }

  // Simple Sort ranking: 1 point per win; point-ties broken by the results among just the
  // tied items (for two items that is their head-to-head duel); a pure cycle keeps the
  // original list order. Recursion always terminates: a group that doesn't split returns.
  function roundRobinOrder(){
    function orderGroup(group){
      if(group.length <= 1) return group;
      const inG = new Set(group);
      const pts = new Map(group.map(it => [it, 0]));
      state.comparisons.forEach(c => {
        if(!inG.has(c.a) || !inG.has(c.b)) return;
        if(c.result === "a") pts.set(c.a, pts.get(c.a) + 1);
        else if(c.result === "b") pts.set(c.b, pts.get(c.b) + 1);
        else { pts.set(c.a, pts.get(c.a) + 0.5); pts.set(c.b, pts.get(c.b) + 0.5); }
      });
      const buckets = new Map();
      group.forEach(it => {
        const k = pts.get(it);
        if(!buckets.has(k)) buckets.set(k, []);
        buckets.get(k).push(it);
      });
      if(buckets.size === 1) return group;      // everyone level — keep original list order
      const out = [];
      [...buckets.keys()].sort((x, y) => y - x).forEach(k => out.push(...orderGroup(buckets.get(k))));
      return out;
    }
    return orderGroup(state.items.slice());
  }

  function finishSort(){
    const order = state.mode === "simple" ? roundRobinOrder() : state.sorted.slice();
    const rating0 = bradleyTerry(state.items, state.comparisons);
    const find = tieGroups(state.items, state.comparisons);
    const blocks = [];
    order.forEach(it=>{
      const last = blocks[blocks.length-1];
      if(last && find(it)===find(last.items[last.items.length-1])) last.items.push(it);
      else blocks.push({ items:[it] });
    });
    blocks.forEach(b=> b.val = b.items.reduce((s,it)=>s+rating0[it],0)/b.items.length);
    const pooled = isotonicWeighted(blocks.map(b=>b.val), blocks.map(b=>b.items.length));
    blocks.forEach((b,i)=> b.score = pooled[i]);
    const results = []; let pos = 1;
    blocks.forEach(b=>{
      const tie = b.items.length > 1;
      b.items.forEach(it=> results.push({ item:it, rating:b.score, rank:pos, tie, done:false }));
      pos += b.items.length;
    });
    // Lift so the lowest score reads as at least 1 — a uniform shift, so gaps and order are unchanged.
    const rounded = results.map(r=>Math.round(r.rating));
    const minScore = Math.min(...rounded);
    const shift = minScore < 1 ? (1 - minScore) : 0;
    results.forEach((r,i)=> r.score = rounded[i] + shift);
    state.results = results;
    syncLoadedList();
    show("results"); renderResults();
  }

  // ---------- Compare rendering ----------
  function renderCompare(){
    const p = currentPair(); if(!p) return;
    const simple = state.mode === "simple";
    $("screen-compare").classList.toggle("simple", simple);
    [["opt-anchor", simple ? "compare.ariaAnchorSimple" : "compare.ariaAnchor"],
     ["opt-ranked", simple ? "compare.ariaRankedSimple" : "compare.ariaRanked"]].forEach(([id, key])=>{
      $(id).dataset.i18nAriaLabel = key;
      $(id).setAttribute("aria-label", t(key));
    });
    $("ask").textContent = state.question;
    $("txt-anchor").textContent = p.a;        // anchor: item being placed / fixed side in Simple Sort
    $("txt-ranked").textContent = p.b;

    const done = state.comparisons.length;
    $("count-step").innerHTML = esc(t(simple ? "compare.comparisonsExact" : "compare.comparisonsStep"))
      .split("{n}").join("<b>" + (done + 1) + "</b>")
      .split("{total}").join(String(state.estTotal));
    if(simple){
      $("place-step").innerHTML = esc(t("compare.comparingStep"))
        .split("{n}").join("<b>" + (p.aIdx + 1) + "</b>")
        .split("{total}").join(String(state.items.length - 1));
    } else {
      const placing = Math.min(state.sorted.length + 1, state.items.length);
      $("place-step").innerHTML = esc(t("compare.placingStep"))
        .split("{n}").join("<b>" + placing + "</b>")
        .split("{total}").join(String(state.items.length));
    }

    setSelection(null);
    $("opt-anchor").classList.remove("chosen"); $("opt-ranked").classList.remove("chosen");
    $("equal").classList.remove("chosen");
    $("back").disabled = state.history.length === 0;
    state.locked = false;
  }
  let selSide = null;   // keyboard highlight: arrows select, Enter/Space accepts
  function setSelection(side){
    selSide = side;
    $("opt-anchor").classList.toggle("pick", side === "anchor");
    $("opt-ranked").classList.toggle("pick", side === "ranked");
  }
  function choose(side){                       // side: 'anchor'|'ranked'|'equal'
    if(state.locked) return;
    if(!currentPair()) return;
    if(side === "equal" && state.mode === "simple") return;   // no draws in Simple Sort
    let res;
    if(side === "equal"){ res = "draw"; $("equal").classList.add("chosen"); }
    else if(side === "anchor"){ res = "a"; $("opt-anchor").classList.add("chosen"); }
    else { res = "b"; $("opt-ranked").classList.add("chosen"); }
    state.locked = true;
    const commit = () => { applyAnswer(res); if(currentPair()) renderCompare(); };
    if(reduceMotion) commit(); else setTimeout(commit, 220);
  }

  // ---------- Results rendering ----------
  const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>';
  function renderResults(){
    const list = $("ranklist"); list.innerHTML = "";
    $("results-q").textContent = state.question;

    const visible = state.results.filter(r=> state.showChecked || !r.done);
    if(visible.length === 0){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = t("results.empty");
      list.appendChild(li);
    }
    state.results.forEach(r=>{
      const li = document.createElement("li");
      li.className = "lrow" + (r.done ? " done" : "") + (r.tie ? " tie" : "") + (r.rank === 1 ? " first" : "");
      if(r.done && !state.showChecked) li.classList.add("hidden");

      const stamp = document.createElement("div"); stamp.className = "stamp"; stamp.textContent = r.rank;
      const name = document.createElement("div"); name.className = "name"; name.textContent = r.item;
      const score = document.createElement("div"); score.className = "score"; score.textContent = r.score;
      const check = document.createElement("label"); check.className = "check"; check.title = t("results.markDone");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = r.done;
      cb.addEventListener("change", ()=>{ r.done = cb.checked; syncLoadedList(); renderResults(); });
      const box = document.createElement("span"); box.className = "box"; box.innerHTML = CHECK_SVG;
      check.appendChild(cb); check.appendChild(box);

      li.appendChild(stamp); li.appendChild(name); li.appendChild(score); li.appendChild(check);
      list.appendChild(li);
    });
    const doneCount = state.results.filter(r=>r.done).length;
    $("done-stat").innerHTML = esc(t("results.doneStat"))
      .split("{done}").join("<b>" + doneCount + "</b>")
      .split("{total}").join("<b>" + state.results.length + "</b>");
    $("toggle-checked").textContent = state.showChecked ? t("results.hideChecked") : t("results.showChecked");
    $("back-results").disabled = state.history.length === 0;
  }

  // ---------- CSV export (question lands in E1) ----------
  function csvCell(v){ v = String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  function downloadCSV(){
    const rows = [[t("results.csvRank"), t("results.csvItem"), t("results.csvScore"), t("results.csvDone"), state.question]];   // 5th header cell => E1
    state.results.forEach(r=> rows.push([r.rank, r.item, r.score, r.done ? t("results.csvYes") : t("results.csvNo")]));
    const csv = rows.map(row=> row.map(csvCell).join(",")).join("\r\n");
    downloadBlob(csv, "text/csv;charset=utf-8", t("results.csvFilename"));
  }
  function downloadBlob(content, type, filename){
    const blob = content instanceof Blob ? content : new Blob([content], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  // ---------- Screens ----------
  function show(name){
    ["input","compare","results"].forEach(s=> $("screen-"+s).classList.toggle("active", s===name));
    window.scrollTo({top:0, behavior: reduceMotion ? "auto" : "smooth"});
  }

  // ---------- Boot ----------
  function bootFail(){
    document.querySelector(".wrap").hidden = true;
    $("boot-fail").hidden = false;
    $("boot-fail-paths").textContent = VERSUS.failed.join("   ");
    document.documentElement.classList.remove("boot");
  }
  function pick(preferred, available){
    if(preferred && available.includes(preferred)) return preferred;
    return available[0];
  }
  function init(){
    if(Object.keys(VERSUS.locales).length === 0 || Object.keys(VERSUS.styles).length === 0) return bootFail();
    const cfg = VERSUS.config;

    // restore persisted user data
    const savedStyles = STORE.get(K_STYLES, null);
    if(savedStyles && savedStyles.styles){
      for(const id in savedStyles.styles){
        const d = savedStyles.styles[id]; d.custom = true;
        if(!VERSUS.styles[id] || VERSUS.styles[id].custom) VERSUS.registerStyle(id, d);
      }
    }
    const savedLocales = STORE.get(K_LOCALES, null);
    if(savedLocales && savedLocales.locales){
      for(const id in savedLocales.locales){
        const d = savedLocales.locales[id]; d.custom = true;
        if(!VERSUS.locales[id] || VERSUS.locales[id].custom) VERSUS.registerLocale(id, d);
      }
    }
    const savedOvr = STORE.get(K_OVR, null);
    if(savedOvr && savedOvr.overrides) overrides = savedOvr.overrides;
    else if(cfg.overrides) overrides = cfg.overrides;
    const savedLists = STORE.get(K_LISTS, null);
    if(savedLists && savedLists.lists) lists = savedLists.lists;
    const work = STORE.get(K_WORK, null);
    if(work){
      if(typeof work.items === "string" && work.items) $("items").value = work.items;
      if(typeof work.question === "string" && work.question) $("question").value = work.question;
      if(["binary","sequential","simple"].includes(work.mode)){
        state.mode = work.mode;
        document.querySelectorAll(".m-opt").forEach(b=> b.classList.toggle("active", b.dataset.mode === state.mode));
      }
    }
    const prefs = STORE.get(K_PREFS, {});

    const localeIds = Object.keys(VERSUS.locales), styleIds = Object.keys(VERSUS.styles);
    i18n.fallback = pick(cfg.fallbackLocale || VERSUS.fallbackLocale, localeIds);
    theming.fallbackId = pick(cfg.fallbackStyle || VERSUS.fallbackStyle, styleIds);

    // listeners
    $("items").addEventListener("input", ()=>{ refreshCount(); queueWorkspaceSave(); });
    $("question").addEventListener("input", ()=>{ autoGrowQuestion(); queueWorkspaceSave(); });
    $("question").addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); $("question").blur(); } });
    $("file").addEventListener("change", e=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => { $("items").value = r.result; refreshCount(); $("input-err").textContent=""; };
      r.onerror = () => { $("input-err").textContent = t("input.errFile"); };
      r.readAsText(f); e.target.value = "";
    });
    document.querySelectorAll(".m-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.mode = btn.dataset.mode;
        renderMethodCounts(); queueWorkspaceSave();
      });
    });
    $("lists-toggle").addEventListener("click", ()=> setSidebar(!sbOpen));
    $("lists-close").addEventListener("click", ()=> setSidebar(false));
    $("list-new").addEventListener("click", newList);
    $("list-import").addEventListener("change", e=>{
      const f = e.target.files[0];
      if(f) importArtifact(f);
      e.target.value = "";
    });
    $("list-save").addEventListener("click", ()=>{
      const name = $("list-name").value.replace(/\s+/g," ").trim();
      if(!name){ showNotice(t("lists.nameNeeded")); $("list-name").focus(); return; }
      saveCurrentList(name);
    });
    $("opt-anchor").addEventListener("click", ()=>choose("anchor"));
    $("opt-ranked").addEventListener("click", ()=>choose("ranked"));
    $("equal").addEventListener("click", ()=>choose("equal"));
    $("back").addEventListener("click", undo);
    document.addEventListener("keydown", e=>{
      if(e.target instanceof Element && e.target.closest("input,textarea,select,#customize,#lists-sidebar,#lists-toggle,#gear")) return;
      if(!$("screen-compare").classList.contains("active")) return;
      // Arrows are physical and only SELECT; Enter or Space accepts the selection.
      const rtl = document.documentElement.dir === "rtl";
      if(e.key==="ArrowLeft"){ e.preventDefault(); setSelection(rtl ? "ranked" : "anchor"); }
      else if(e.key==="ArrowRight"){ e.preventDefault(); setSelection(rtl ? "anchor" : "ranked"); }
      else if(e.key==="Enter"||e.key===" "){ if(selSide){ e.preventDefault(); choose(selSide); } }
      else if(e.key==="ArrowDown"||e.key==="="||e.key.toLowerCase()==="e"){ e.preventDefault(); choose("equal"); }
      else if(e.key==="Backspace"||e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
    });
    $("toggle-checked").addEventListener("click", ()=>{ state.showChecked = !state.showChecked; renderResults(); });
    $("back-results").addEventListener("click", undo);
    $("restart").addEventListener("click", ()=>{ show("input"); refreshCount(); });
    $("csv").addEventListener("click", downloadCSV);
    $("start").addEventListener("click", beginSort);
    $("gear").addEventListener("click", ()=>{ $("customize").hidden = !$("customize").hidden; });
    $("panel-close").addEventListener("click", ()=>{ $("customize").hidden = true; });
    $("locale-select").addEventListener("change", e=> applyLocale(e.target.value));
    $("style-select").addEventListener("change", e=> applyStyle(e.target.value));
    $("style-reset").addEventListener("click", ()=> applyStyle(theming.styleId));
    $("style-save").addEventListener("click", ()=>{
      const name = $("style-name").value.trim();
      if(!name) return;
      saveStyleAs(name);
      $("style-name").value = "";
    });
    $("ovr-filter").addEventListener("input", buildOverrideEditor);
    $("export-site").addEventListener("click", exportSiteHTML);
    $("export-zip").addEventListener("click", exportSiteZip);
    $("export-style").addEventListener("click", exportCurrentStyle);
    $("export-locale").addEventListener("click", exportCurrentLocale);
    $("import-file").addEventListener("change", e=>{
      const f = e.target.files[0];
      if(f) importArtifact(f);
      e.target.value = "";
    });

    applyStyle(pick(prefs.styleId || cfg.defaultStyle || VERSUS.defaultStyle, styleIds));
    applyLocale(pick(prefs.locale || cfg.defaultLocale || VERSUS.defaultLocale, localeIds));
    setSidebar(prefs.sidebar != null ? !!prefs.sidebar : matchMedia("(min-width:900px)").matches);
    document.documentElement.classList.remove("boot");
    if(!STORE.ok) showNotice(t("panel.storageWarn"));

    // PWA: register the service worker only for the folder-based site over http(s) —
    // never for file:// or standalone single-file exports (sw.js won't exist there).
    if("serviceWorker" in navigator && !cfg.standalone &&
       (location.protocol === "https:" || ["localhost","127.0.0.1"].includes(location.hostname))){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  }
  VERSUS.ready(init);
})();
</script>
</body>
